services:
  postgres:
    image: postgres:16
    container_name: entsoe-kestra-postgres
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  kestra:
    image: kestra/kestra:latest
    env_file:
      - .env_encoded
    container_name: entsoe-kestra
    depends_on:
      - postgres
    user: "root"
    command: server standalone
    ports:
      - "8080:8080"
      - "8081:8081"

    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            username: kestra
            password: kestra

        kestra:
          server:
            basic-auth:
              enabled: false
            repository:
              type: postgres

          queue:
            type: postgres

          storage:
            type: local
            local:
              base-path: /app/storage

          repository:
            type: postgres

          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp

          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true

    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped

volumes:
  postgres-data:
  kestra-data: